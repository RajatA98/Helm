<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, turns: 0 };
  }
  renderVals() {
    const headings = [
      { name: 'Get Fit', isle: 'Heal the Shoulders', num: 'isle 1 of 4', count: '2 of 3 today', left: 3, bosun: "No workout yet, Captain. The log's on the barrel." },
      { name: 'Get Hired', isle: 'Ship the Portfolio', num: 'isle 2 of 5', count: '0 of 2 today', left: 2, bosun: 'Two applications before sundown, Captain.' }
    ];
    const i = this.state.i;
    const cur = headings[i];
    const other = headings[(i + 1) % headings.length];
    return {
      headingName: cur.name,
      isleName: cur.isle,
      isleNum: cur.num,
      otherName: other.name,
      otherCount: other.count,
      bosun: cur.bosun,
      logLeft: cur.left,
      wheelDeg: 8 + this.state.turns * 150,
      turn: () => this.setState({ i: (i + 1) % headings.length, turns: this.state.turns + 1 })
    };
  }
}
</script>
