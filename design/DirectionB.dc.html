<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; background: #fff8ea; }
    a { color: #2455c9; } a:hover { color: #173d99; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #fff8ea; font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; color: #15120f;">

  <div style="padding: 54px 20px 0; display: flex; justify-content: space-between; align-items: center;">
    <div style="font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 40px; line-height: 1; letter-spacing: 0.02em; text-shadow: 3px 3px 0 #ffc53d;">HELM</div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 4px 12px; background: #ffffff; border: 2.5px solid #15120f; border-radius: 999px; box-shadow: 2px 2px 0 #15120f; font-weight: 700; font-size: 15px;">
      <svg width="16" height="18" viewBox="0 0 24 24" style="fill: #ee4b3b; stroke: #15120f; stroke-width: 1.8; stroke-linejoin: round;"><path d="M12 2c1 3.5 5.5 5.5 5.5 10.5a5.5 5.5 0 0 1-11 0c0-2.2 1-3.8 2.2-5 0 2.2 1 3.3 2.3 3.3 0-3.3-1-5.3 1-8.8z"></path></svg>
      <span>12-day streak</span>
    </div>
  </div>

  <div style="padding: 12px 20px 0; display: flex; align-items: center; gap: 10px;">
    <div style="font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 16px; letter-spacing: 0.03em;">HULL</div>
    <div style="display: flex; gap: 4px;">
      <div style="width: 30px; height: 16px; border: 2.5px solid #15120f; border-radius: 5px; background: #2455c9;"></div>
      <div style="width: 30px; height: 16px; border: 2.5px solid #15120f; border-radius: 5px; background: #2455c9;"></div>
      <div style="width: 30px; height: 16px; border: 2.5px solid #15120f; border-radius: 5px; background: #2455c9;"></div>
      <div style="width: 30px; height: 16px; border: 2.5px solid #15120f; border-radius: 5px; background: #2455c9;"></div>
      <div style="width: 30px; height: 16px; border: 2.5px solid #15120f; border-radius: 5px; background: #ffffff;"></div>
    </div>
    <div style="margin-left: auto; padding: 2px 10px; background: #ee4b3b; color: #ffffff; border: 2.5px solid #15120f; border-radius: 999px; font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 14px; letter-spacing: 0.03em;">2 LEAKS</div>
  </div>

  <div style="padding: 12px 20px 0; display: flex; gap: 10px; align-items: center;">
    <div style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; background: #ffc53d; border: 2.5px solid #15120f; border-radius: 14px; box-shadow: 3px 3px 0 #15120f; font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 18px; letter-spacing: 0.02em;">GET FIT</div>
    <div style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; background: #ffffff; border: 2.5px solid #15120f; border-radius: 14px; font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 18px; letter-spacing: 0.02em; color: #4a4239;">GET HIRED</div>
    <div style="width: 44px; height: 44px; box-sizing: border-box; border: 2.5px dashed #15120f; border-radius: 14px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" style="fill: none; stroke: #15120f; stroke-width: 3; stroke-linecap: round;"><path d="M12 5v14M5 12h14"></path></svg>
    </div>
  </div>

  <div style="margin-top: 12px; position: relative; height: 196px; background: #2455c9; overflow: hidden; flex-shrink: 0;">
    <svg width="390" height="196" viewBox="0 0 390 196" style="position: absolute; left: 0; top: 0; display: block;">
      <path d="M0 12 Q16.25 0 32.5 12 T65 12 T97.5 12 T130 12 T162.5 12 T195 12 T227.5 12 T260 12 T292.5 12 T325 12 T357.5 12 T390 12 V0 H0 Z" style="fill: #fff8ea;"></path>
      <path d="M0 12 Q16.25 0 32.5 12 T65 12 T97.5 12 T130 12 T162.5 12 T195 12 T227.5 12 T260 12 T292.5 12 T325 12 T357.5 12 T390 12" style="fill: none; stroke: #15120f; stroke-width: 2.5;"></path>
      <path d="M-10 166 Q10 156 30 166 T70 166 T110 166 T150 166 T190 166 T230 166 T270 166 T310 166 T350 166 T390 166 T430 166" style="fill: none; stroke: rgba(255,255,255,0.28); stroke-width: 3; stroke-linecap: round;"></path>
      <path d="M-30 184 Q-10 174 10 184 T50 184 T90 184 T130 184 T170 184 T210 184 T250 184 T290 184 T330 184 T370 184 T410 184" style="fill: none; stroke: rgba(255,255,255,0.18); stroke-width: 3; stroke-linecap: round;"></path>
    </svg>
    <svg width="192" height="192" viewBox="-96 -96 192 192" style="position: absolute; left: 144px; top: 6px; display: block;">
      <defs>
        <g id="spokeB">
          <line x1="0" y1="-18" x2="0" y2="-74" style="stroke: #15120f; stroke-width: 11; stroke-linecap: round;"></line>
          <line x1="0" y1="-18" x2="0" y2="-74" style="stroke: #c9773f; stroke-width: 5.5; stroke-linecap: round;"></line>
          <line x1="0" y1="-77" x2="0" y2="-86" style="stroke: #15120f; stroke-width: 16; stroke-linecap: round;"></line>
          <line x1="0" y1="-77" x2="0" y2="-86" style="stroke: #c9773f; stroke-width: 10.5; stroke-linecap: round;"></line>
        </g>
      </defs>
      <g transform="rotate(14)">
        <use href="#spokeB"></use>
        <use href="#spokeB" transform="rotate(45)"></use>
        <use href="#spokeB" transform="rotate(90)"></use>
        <use href="#spokeB" transform="rotate(135)"></use>
        <use href="#spokeB" transform="rotate(180)"></use>
        <use href="#spokeB" transform="rotate(225)"></use>
        <use href="#spokeB" transform="rotate(270)"></use>
        <use href="#spokeB" transform="rotate(315)"></use>
        <circle r="58" style="fill: none; stroke: #15120f; stroke-width: 17;"></circle>
        <circle r="58" style="fill: none; stroke: #c9773f; stroke-width: 11.5;"></circle>
        <circle r="18" style="fill: #c9773f; stroke: #15120f; stroke-width: 3;"></circle>
        <circle r="6" style="fill: #15120f;"></circle>
      </g>
    </svg>
    <div style="position: absolute; left: 14px; top: 34px; width: 116px; box-sizing: border-box; padding: 8px 10px; background: #fff8ea; border: 2.5px solid #15120f; border-radius: 12px; box-shadow: 3px 3px 0 #15120f; display: flex; flex-direction: column; gap: 1px;">
      <div style="font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 12px; letter-spacing: 0.05em; color: #2455c9;">NEXT ISLAND</div>
      <div style="font-weight: 700; font-size: 16px; line-height: 1.1;">Heal the Shoulders</div>
      <div style="font-weight: 600; font-size: 13px; color: #6b625a;">1 of 4</div>
    </div>
  </div>

  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 7px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 21px; letter-spacing: 0.02em;">SHIP'S LOG</div>
      <div style="font-weight: 700; font-size: 15px; color: #6b625a;">Get Fit · 2 / 3</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 14px; background: #ffffff; border: 2.5px solid #15120f; border-radius: 14px;">
      <div style="width: 28px; height: 28px; box-sizing: border-box; border: 2.5px solid #15120f; border-radius: 8px; background: #ffc53d; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" style="fill: none; stroke: #15120f; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round;"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
      </div>
      <div style="font-weight: 600; font-size: 16px; color: #8a8178; text-decoration: line-through;">Shoulder PT — band rotations</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 14px; background: #ffffff; border: 2.5px solid #15120f; border-radius: 14px;">
      <div style="width: 28px; height: 28px; box-sizing: border-box; border: 2.5px solid #15120f; border-radius: 8px; background: #ffc53d; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" style="fill: none; stroke: #15120f; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round;"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
      </div>
      <div style="font-weight: 600; font-size: 16px; color: #8a8178; text-decoration: line-through;">Mobility, 15 minutes</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 14px; background: #ffffff; border: 2.5px solid #15120f; border-radius: 14px; box-shadow: 3px 3px 0 #15120f;">
      <div style="width: 28px; height: 28px; box-sizing: border-box; border: 2.5px solid #15120f; border-radius: 8px; background: #ffffff; flex-shrink: 0;"></div>
      <div style="font-weight: 700; font-size: 16px; flex-grow: 1;">Lower-body strength</div>
      <div style="display: flex; align-items: center; gap: 4px; padding: 1px 8px; background: #ee4b3b; color: #ffffff; border: 2px solid #15120f; border-radius: 999px; font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 12px; letter-spacing: 0.04em;">
        <svg width="13" height="13" viewBox="0 0 24 24" style="fill: none; stroke: #ffffff; stroke-width: 2.4; stroke-linejoin: round;"><path d="M3 8h3.5l2-2.5h7l2 2.5H21v11H3z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        <span>PROOF</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 46px; padding: 0 14px; border: 2.5px dashed #15120f; border-radius: 14px;">
      <div style="font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 16px; letter-spacing: 0.02em; color: #4a4239;">GET HIRED · 0 / 2</div>
      <svg width="18" height="18" viewBox="0 0 24 24" style="fill: none; stroke: #15120f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;"><path d="M9 5l7 7-7 7"></path></svg>
    </div>
  </div>

  <div style="padding: 10px 20px 0; display: flex; gap: 10px; align-items: flex-end;">
    <div style="width: 40px; height: 40px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; background: #ee4b3b; border: 2.5px solid #15120f; display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 18px; color: #ffffff;">B</div>
    <div style="padding: 7px 12px; background: #ffffff; border: 2.5px solid #15120f; border-radius: 14px 14px 14px 4px; font-weight: 600; font-size: 15px; line-height: 1.3;">No workout yet, Captain! Legs before sundown — bring a pic.</div>
  </div>

  <div style="margin-top: auto; display: flex; justify-content: space-around; align-items: center; padding: 10px 20px 28px; background: #ffffff; border-top: 2.5px solid #15120f;">
    <div style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; background: #ffc53d; border: 2.5px solid #15120f; border-radius: 999px; font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 15px;">
      <svg width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: #15120f; stroke-width: 2.2; stroke-linecap: round;"><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="1.6"></circle><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"></path></svg>
      <span>HELM</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 15px; color: #6b625a;">
      <svg width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: #6b625a; stroke-width: 2.2; stroke-linejoin: round;"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>
      <span>MAPS</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; font-family: 'Lilita One', 'Arial Black', sans-serif; font-size: 15px; color: #6b625a;">
      <svg width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: #6b625a; stroke-width: 2.2; stroke-linecap: round;"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16.5 13.6c2.7.3 4.5 2.3 4.5 5.4"></path></svg>
      <span>ALLIES</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
