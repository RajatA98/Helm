<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #fbfaf6; }
    a { color: #c8412f; } a:hover { color: #9c2f20; }
    .sk { border: 2px solid #2b2b2b; border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; }
    .skb { border: 2px solid #2b2b2b; border-radius: 6px 10px 5px 9px / 9px 5px 10px 6px; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #fbfaf6; font-family: 'Kalam', 'Comic Sans MS', cursive; color: #2b2b2b;">

  <div style="padding: 56px 20px 0; display: flex; flex-direction: column;">
    <div style="font-size: 15px; color: #8a8580;">step 1 of 3 · before you meet the Captain</div>
    <div style="font-size: 32px; font-weight: 700; line-height: 1.1;">Who's at the helm?</div>
  </div>

  <div style="display: flex; justify-content: center; margin-top: 10px;">
    <div class="sk" style="width: 180px; height: 180px; display: flex; align-items: flex-end; justify-content: center; background: #fffdf8; overflow: hidden;">
      <svg width="171" height="180" viewBox="0 0 190 200" style="display: block; fill: none; stroke: #2b2b2b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;">
        <path d="M30 200 Q34 150 70 138 L120 138 Q156 150 160 200"></path>
        <path d="M78 138 L95 162 L112 138"></path>
        <path d="M95 162 L95 200"></path>
        <rect x="84" y="118" width="22" height="22" style="fill: #fbfaf6;"></rect>
        <ellipse cx="95" cy="88" rx="34" ry="38" style="fill: #fbfaf6;"></ellipse>
        <path d="M61 82 Q62 48 95 46 Q128 48 129 82 Q95 70 61 82 Z" style="fill: #3aa597; stroke: #2b2b2b;"></path>
        <path d="M129 74 Q146 70 152 60 M129 80 Q148 84 156 76" style="stroke: #3aa597; stroke-width: 4;"></path>
        <circle cx="82" cy="92" r="2.4" style="fill: #2b2b2b;"></circle>
        <circle cx="108" cy="92" r="2.4" style="fill: #2b2b2b;"></circle>
        <path d="M84 108 Q95 116 106 108"></path>
      </svg>
    </div>
  </div>

  <div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 16px; color: #8a8580;">Skin</div>
      <div style="display: flex; gap: 10px;">
        <div style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid #2b2b2b; background: #f1d3b8;"></div>
        <div style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid #2b2b2b; background: #dcae88;"></div>
        <div style="width: 32px; height: 32px; border-radius: 50%; border: 3.5px solid #2b2b2b; background: #b0784f; box-shadow: 0 0 0 3px #fbfaf6, 0 0 0 5px #2b2b2b;"></div>
        <div style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid #2b2b2b; background: #8a5a3a;"></div>
        <div style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid #2b2b2b; background: #5e3b26;"></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 16px; color: #8a8580;">Hair</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <div class="sk" style="padding: 2px 12px; font-size: 15px; background: #2b2b2b; color: #fbfaf6;">short</div>
        <div class="sk" style="padding: 2px 12px; font-size: 15px;">long</div>
        <div class="sk" style="padding: 2px 12px; font-size: 15px;">tied back</div>
        <div class="sk" style="padding: 2px 12px; font-size: 15px;">curly</div>
        <div class="sk" style="padding: 2px 12px; font-size: 15px;">shaved</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 16px; color: #8a8580;">Headwear</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <div class="sk" style="padding: 2px 12px; font-size: 15px; background: #2b2b2b; color: #fbfaf6;">bandana</div>
        <div class="sk" style="padding: 2px 12px; font-size: 15px;">tricorn</div>
        <div class="sk" style="padding: 2px 12px; font-size: 15px;">headband</div>
        <div class="sk" style="padding: 2px 12px; font-size: 15px;">none</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 16px; color: #8a8580;">Coat</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <div class="sk" style="padding: 2px 12px; font-size: 15px; background: #2b2b2b; color: #fbfaf6;">long coat</div>
        <div class="sk" style="padding: 2px 12px; font-size: 15px;">vest</div>
        <div class="sk" style="padding: 2px 12px; font-size: 15px;">open shirt</div>
      </div>
    </div>

    <div style="display: flex; gap: 10px;">
      <div class="skb" style="flex: 1; padding: 6px 10px; display: flex; flex-direction: column; line-height: 1.15;">
        <span style="font-size: 13px; color: #8a8580;">Captain</span>
        <span style="font-size: 17px;">[your name]</span>
      </div>
      <div class="skb" style="flex: 1; padding: 6px 10px; display: flex; flex-direction: column; line-height: 1.15;">
        <span style="font-size: 13px; color: #8a8580;">Your ship</span>
        <span style="font-size: 17px;">[name her]</span>
      </div>
    </div>
  </div>

  <div style="margin-top: auto; padding: 12px 20px 36px;">
    <div class="sk" style="min-height: 52px; display: flex; align-items: center; justify-content: center; background: #2b2b2b; color: #fbfaf6; font-size: 20px; font-weight: 700;">Meet the Captain ›</div>
  </div>

</div>
</x-dc>
</body>
</html>
